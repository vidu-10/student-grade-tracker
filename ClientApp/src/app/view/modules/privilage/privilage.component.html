<mat-grid-list cols="12" rowHeight="4rem">
  <mat-grid-tile [colspan]="5" [rowspan]="7">

    <mat-card id="privilageform">

      <mat-card-header>
        <mat-card-title>Privilege</mat-card-title>
      </mat-card-header>

      <mat-card-content>

        <mat-form [formGroup]="form">

          <mat-form-field appearance="outline" class="form-field">
            <mat-label>Role</mat-label>
            <mat-select [value]="null" selected formControlName="role">
              <mat-option *ngFor="let role of roles " [value]="role">{{ role.name }}</mat-option>
            </mat-select>
          </mat-form-field>

          <mat-form-field appearance="outline" class="form-field">
            <mat-label>Module</mat-label>
            <mat-select [value]="null" formControlName="module" (selectionChange)="onModuleSelectionChange($event)">
              <mat-option *ngFor="let module of modules" [value]="module">{{ module.name }}</mat-option>
            </mat-select>
          </mat-form-field>

          <mat-form-field appearance="outline" class="form-field">
            <mat-label>Operation</mat-label>
            <mat-select [value]="null" formControlName="operation" (selectionChange)="generateAuthority()">
              <mat-option *ngFor="let operation of operations" [value]="operation">{{ operation.name }}</mat-option>
            </mat-select>
          </mat-form-field>

          <mat-form-field appearance="outline" class="form-field">
            <mat-label>Authority</mat-label>
            <input matInput readonly formControlName="authority">
          </mat-form-field>


          <div class="btn-row">
            <button mat-raised-button color="primary" (click)="add()" [disabled]="!enaadd">
              <mat-icon>save</mat-icon>
              Save
            </button>
            <button mat-stroked-button (click)="clear()">
              <mat-icon>clear</mat-icon>
              Clear
            </button>
            <button mat-stroked-button (click)="update()" [disabled]="!enaupd">Update</button>
            <button mat-stroked-button (click)="delete()" [disabled]="!enadel">Delete</button>
          </div>

        </mat-form>
      </mat-card-content>
    </mat-card>
  </mat-grid-tile>

  <mat-grid-tile [colspan]="7" [rowspan]="11">

    <mat-card >

      <mat-card-header>
        <mat-card-title>Search Privilege</mat-card-title>
      </mat-card-header>
      <mat-card-content>

        <mat-form [formGroup]="ssearch">

          <div class="search-row-pill">

            <select class="pill-select" formControlName="ssmodule">
              <option [ngValue]="null">Search by module</option>
              <option *ngFor="let module of modules" [value]="module.id">{{ module.name }}</option>
            </select>

            <select class="pill-select" formControlName="ssrole">
              <option [ngValue]="null">Search by role</option>
              <option *ngFor="let role of roles" [value]="role.id">{{ role.name }}</option>
            </select>

            <select class="pill-select" formControlName="ssoperation">
              <option [ngValue]="null">Search by operation</option>
              <option *ngFor="let operation of operations" [value]="operation.id">{{ operation.name }}</option>
            </select>

            <button class="pill-search-btn" (click)="btnSearchMc()">
              <mat-icon>search</mat-icon>
            </button>
          </div>

          <div class="btn-row">
            <button mat-stroked-button class="clear-btn" (click)="btnSearchClearMc()">
              <mat-icon>clear</mat-icon>
              Clear Search
            </button>
          </div>

        </mat-form>

        <mat-table [dataSource]="data">

          <ng-container *ngFor="let column of columns;let i = index;" [matColumnDef]="column">
            <mat-header-cell *matHeaderCellDef> {{ headers[i] }}</mat-header-cell>
            <mat-cell *matCellDef="let element">{{ uiassist.getProperty(element, binders[i]) }}</mat-cell>
          </ng-container>

          <mat-header-row *matHeaderRowDef="columns"></mat-header-row>
          <mat-row *matRowDef="let row; columns: columns;" (click)="fillForm(row)"
                   [ngClass]="{'selected-row': row === selectedrow}"></mat-row>

        </mat-table>

        <mat-paginator [length]="20" [pageSize]="10" [pageSizeOptions]="[5,10,20]"></mat-paginator>

      </mat-card-content>
    </mat-card>
  </mat-grid-tile>

</mat-grid-list>
